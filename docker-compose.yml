version: "3.8"

# DRIVIN-TAT para Dokploy. La base de datos es externa (PostgreSQL remoto),
# por eso no se levanta un contenedor de BD: se pasa por DATABASE_URL.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vacío = el frontend llama a /api en el mismo dominio (vía Nginx/Traefik).
        NEXT_PUBLIC_API_URL: ""
    container_name: tatdrivin-app
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://distrilog.grupo-santacruz.com}
      DRIVIN_API_URL: ${DRIVIN_API_URL:-https://external.driv.in/api/external}
      DRIVIN_API_KEY: ${DRIVIN_API_KEY}
      CLIENTES_TAT_URL: ${CLIENTES_TAT_URL:-https://apiconsulta.grupo-santacruz.com/clientes-tat}
      TAT_INVOICES_URL: ${TAT_INVOICES_URL}
      TAT_INVOICES_TOKEN: ${TAT_INVOICES_TOKEN}
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "dokploy.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.tatdrivin.rule=Host(`distrilog.grupo-santacruz.com`)"
      - "traefik.http.routers.tatdrivin.entrypoints=websecure"
      - "traefik.http.routers.tatdrivin.tls=true"
      - "traefik.http.routers.tatdrivin.tls.certresolver=letsencrypt"
      - "traefik.http.services.tatdrivin.loadbalancer.server.port=80"
      - "traefik.http.routers.tatdrivin-web.rule=Host(`distrilog.grupo-santacruz.com`)"
      - "traefik.http.routers.tatdrivin-web.entrypoints=web"
      - "traefik.http.routers.tatdrivin-web.middlewares=tatdrivin-redirect-https"
      - "traefik.http.middlewares.tatdrivin-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.tatdrivin-redirect-https.redirectscheme.permanent=true"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
